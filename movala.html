<style>
  :root{
    --nuit:#14213D; --nuit-2:#1B2A4E; --phare:#FFB627; --phare-doux:#FFD98C;
    --laterite:#C1440E; --sable:#F2E9DC; --sable-2:#E9DCC7; --charbon:#1B1B1B;
    --vert:#3D8361; --gris:#6b6458;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--sable); color:var(--charbon); font-family:'Work Sans',sans-serif; -webkit-font-smoothing:antialiased;}
  .display{font-family:'Archivo Black',sans-serif;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  a{color:inherit;}
  #app{min-height:100vh; padding-bottom:40px;}

  /* topbar */
  .topbar{
    background:var(--nuit); color:var(--sable); padding:14px 18px;
    display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:50;
  }
  .brand{font-family:'Archivo Black'; font-size:19px; letter-spacing:.02em; display:flex; align-items:center; gap:6px; text-decoration:none; color:var(--sable);}
  .brand .dot{width:8px;height:8px;border-radius:50%;background:var(--phare);}
  .topbar nav{display:flex; gap:6px; font-size:12.5px;}
  .topbar nav a{padding:7px 10px; border-radius:8px; text-decoration:none; color:#D9D2C4;}
  .topbar nav a:hover{background:rgba(255,255,255,.08);}

  .banner{padding:10px 16px; font-size:12.5px; text-align:center;}
  .banner.warn{background:#FFF3D6; color:#8A6100;}
  .banner.err{background:#FBEAE3; color:var(--laterite);}

  /* hero */
  .hero{background:radial-gradient(120% 140% at 15% -10%, var(--nuit-2) 0%, var(--nuit) 55%, #0B1428 100%); color:var(--sable); padding:44px 22px 56px;}
  .eyebrow{font-family:'IBM Plex Mono'; font-size:11.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--phare-doux); margin-bottom:14px;}
  h1.display{font-size:clamp(30px,7vw,46px); line-height:1.05; margin:0 0 14px; max-width:13ch;}
  h1.display .accent{color:var(--phare);}
  .hero p.lead{font-size:15.5px; line-height:1.55; max-width:44ch; color:#D9D2C4; margin:0 0 26px;}
  .hero-grid{display:flex; gap:12px; flex-wrap:wrap;}
  .card-choice{
    flex:1; min-width:150px; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.14);
    border-radius:16px; padding:18px; text-align:left; cursor:pointer; color:var(--sable); text-decoration:none;
  }
  .card-choice:hover{border-color:var(--phare);}
  .card-choice .ic{font-size:26px; margin-bottom:8px; display:block;}
  .card-choice b{display:block; font-size:15px; margin-bottom:2px;}
  .card-choice span{font-size:12px; color:#B9B2A4;}
  .hero-links{margin-top:18px; display:flex; gap:16px; flex-wrap:wrap; font-size:13px;}
  .hero-links a{text-decoration:underline; color:var(--phare-doux);}

  section{padding:40px 20px; max-width:640px; margin:0 auto;}
  .section-head .tag{font-family:'IBM Plex Mono'; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--laterite); display:block; margin-bottom:6px;}
  .section-head h2{font-family:'Archivo Black'; font-size:22px; margin:0; color:var(--nuit);}
  .section-head p{color:var(--gris); margin:8px 0 0; font-size:14px; line-height:1.5;}
  .steps{display:flex; flex-direction:column; gap:12px; margin-top:18px;}
  .step{display:flex; gap:12px; align-items:flex-start; background:#fff; border:1px solid var(--sable-2); border-radius:14px; padding:14px;}
  .step .n{width:28px;height:28px;border-radius:50%;background:var(--nuit);color:var(--phare);font-family:'Archivo Black';font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .step p{margin:0; font-size:13.5px; color:var(--charbon); line-height:1.5;}

  /* forms */
  .form-card{background:#fff; border:1px solid var(--sable-2); border-radius:18px; padding:20px; margin:0 20px 20px;}
  .form-row{margin-bottom:14px;}
  label{display:block; font-size:12.5px; font-weight:600; color:var(--nuit); margin-bottom:6px;}
  input, select, textarea{width:100%; padding:11px 13px; border-radius:10px; border:1px solid var(--sable-2); background:var(--sable); font-family:'Work Sans'; font-size:14.5px; color:var(--charbon);}
  input:focus, select:focus, textarea:focus{outline:2px solid var(--phare); outline-offset:1px;}
  .btn{border:none; border-radius:999px; padding:13px 22px; font-family:'Work Sans'; font-weight:600; font-size:14.5px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px; text-decoration:none;}
  .btn-phare{background:var(--phare); color:var(--nuit);}
  .btn-ghost{background:transparent; color:var(--sable); border:1px solid rgba(242,233,220,.35);}
  .btn-ghost.dark{color:var(--nuit); border-color:var(--sable-2);}
  .btn-danger{background:transparent; color:var(--laterite); border:1px solid #E8C9BC;}
  .btn-block{width:100%;}
  .btn-sm{padding:8px 14px; font-size:13px; border-radius:999px;}
  .msg{font-size:13px; margin-top:10px; display:none; padding:10px 12px; border-radius:10px;}
  .msg.ok{color:var(--vert); background:#E8F3EC; display:block;}
  .msg.err{color:var(--laterite); background:#FBEAE3; display:block;}
  .type-toggle{display:flex; gap:10px;}
  .type-toggle label{flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; padding:14px 8px; border-radius:12px; border:1.5px solid var(--sable-2); font-weight:700; font-size:13px; cursor:pointer; margin:0; color:var(--gris);}
  .type-toggle input{display:none;}
  .type-toggle input:checked + span{color:var(--nuit);}
  .type-toggle label:has(input:checked){border-color:var(--phare); background:#FFF6E0;}
  .type-toggle .ic{font-size:22px;}

  /* status */
  .status-box{background:#fff; border-radius:18px; border:1px solid var(--sable-2); padding:22px; margin:0 20px; text-align:center;}
  .status-pill{display:inline-flex; align-items:center; gap:7px; padding:7px 14px; border-radius:999px; font-family:'IBM Plex Mono'; font-size:12px; margin-bottom:14px;}
  .status-pill.attente{background:#FFF3D6; color:#8A6100;}
  .status-pill.attribuee{background:#E4F5EA; color:var(--vert);}
  .status-pill.terminee{background:#E4E9FA; color:var(--nuit);}
  .status-pill.annulee{background:#FBEAE3; color:var(--laterite);}
  .spin{width:14px;height:14px;border-radius:50%;border:2px solid rgba(138,97,0,.25);border-top-color:#8A6100;animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .resa-id{font-family:'IBM Plex Mono'; font-size:13px; color:var(--gris); margin-bottom:6px;}
  .driver-reveal{background:var(--sable); border-radius:14px; padding:16px; margin-top:16px; text-align:left;}
  .driver-reveal .avatar{width:44px;height:44px;border-radius:50%;background:var(--nuit);color:var(--phare-doux);display:flex;align-items:center;justify-content:center;font-family:'Archivo Black';overflow:hidden;float:left;margin-right:12px;}
  .driver-reveal .avatar img{width:100%;height:100%;object-fit:cover;}

  /* cards / lists */
  .list{display:flex; flex-direction:column; gap:10px; margin:0 20px;}
  .item-card{background:#fff; border:1px solid var(--sable-2); border-radius:14px; padding:14px;}
  .item-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px; margin-bottom:6px;}
  .item-title{font-weight:700; font-size:14.5px;}
  .item-sub{font-size:12.5px; color:var(--gris); margin-top:2px;}
  .badge{font-family:'IBM Plex Mono'; font-size:10px; padding:4px 9px; border-radius:999px; white-space:nowrap;}
  .badge-attente{background:#FFF3D6;color:#8A6100;}
  .badge-attribuee{background:#E4F5EA;color:var(--vert);}
  .badge-terminee{background:#E4E9FA;color:var(--nuit);}
  .badge-annulee{background:#FBEAE3;color:var(--laterite);}
  .item-actions{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}
  .empty{text-align:center; padding:26px 16px; color:var(--gris); border:1px dashed var(--sable-2); border-radius:14px; font-size:13.5px; margin:0 20px;}

  .stats{display:flex; flex-wrap:wrap; gap:10px; margin:0 20px 18px;}
  .stat{flex:1; min-width:100px; background:var(--nuit); border-radius:14px; padding:14px; text-align:center; color:var(--sable);}
  .stat b{display:block; font-family:'Archivo Black'; font-size:19px; color:var(--phare);}
  .stat span{font-size:10.5px; color:#B9B2A4;}

  .tabs{display:flex; gap:6px; margin:0 20px 18px; overflow-x:auto; padding-bottom:2px;}
  .tab{padding:9px 15px; border-radius:999px; font-size:12.5px; font-weight:600; white-space:nowrap; cursor:pointer; border:1px solid var(--sable-2); background:#fff; color:var(--gris);}
  .tab.active{background:var(--nuit); color:var(--phare); border-color:var(--nuit);}

function readAndCompressImage(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("Impossible de lire l'image."));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("Image invalide."));
      img.onload = () => {
        const size = 200;
        const canvas = document.createElement('canvas');
        canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext('2d');
        const scale = Math.max(size / img.width, size / img.height);
        const w = img.width * scale, h = img.height * scale;
        ctx.drawImage(img, (size - w) / 2, (size - h) / 2, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.72));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

  const raw = location.hash.slice(1) || '/';

  if(qs) qs.split('&').forEach(kv => { const [k,v] = kv.split('='); if(k) params[decodeURIComponent(k)] = decodeURIComponent(v||''); });
  return { path: path || '/', params };
}

async function renderConducteurDashboard(params){

  if(!c){ navigate('#/conducteur'); return; }

  function statutLabel(s){
    if(s === 'disponible') return '🟢 Disponible';
    if(s === 'en_course') return '🔴 En course';
    return '⚪ Hors ligne';
  }

  app.innerHTML = `
    ${topbar('conducteur')}
    <section style="padding-bottom:0;">
      <div class="section-head"><span class="tag">Espace conducteur</span><h2>Bonjour, ${esc(c.nom)}</h2></div>
    </section>
    <div class="form-card" id="statutZone">
      <label style="margin-bottom:10px;">Mon statut</label>
      <div class="type-toggle" id="statutButtons">
        <label data-statut="disponible" style="${c.statut==='disponible'?'border-color:var(--phare);background:#FFF6E0;':''}"><span class="ic">🟢</span><span>Disponible</span></label>
        <label data-statut="en_course" style="opacity:${c.statut==='en_course'?'1':'.4'}; ${c.statut==='en_course'?'border-color:var(--phare);background:#FFF6E0;':''}"><span class="ic">🔴</span><span>En course</span></label>
        <label data-statut="hors_ligne" style="${c.statut==='hors_ligne'||!c.statut?'border-color:var(--phare);background:#FFF6E0;':''}"><span class="ic">⚪</span><span>Hors ligne</span></label>
      </div>
      <p id="statutMsg" style="font-size:12px; color:var(--gris); margin:10px 0 0;">${c.statut==='en_course' ? "Terminez votre course en cours pour changer de statut." : "Appuyez sur Disponible pour recevoir des courses."}</p>
    </div>
    <div class="tabs">
      <div class="tab active" data-tab="demandes">Demandes disponibles <span id="demandesCount" style="display:inline-block; min-width:18px; padding:1px 6px; border-radius:100px; background:var(--laterite); color:#fff; font-size:11px; font-weight:700; margin-left:4px;">0</span></div>
      <div class="tab" data-tab="cours">Ma course en cours</div>
      <div class="tab" data-tab="terminees">Terminées</div>
    </div>
    <div id="tabContent"></div>
    <section style="text-align:center; padding-top:8px;">
      <button type="button" id="signalBtn" class="btn btn-ghost dark btn-sm">Signaler un problème</button>
      <br><br>
      <a href="#/conducteur" style="font-size:12.5px; color:var(--gris); text-decoration:underline;">Se déconnecter</a>
    </section>
    ${footerHtml()}
  `;

  document.getElementById('signalBtn').addEventListener('click', () => openSignalModal('conducteur', c.telephone));

  document.querySelectorAll('#statutButtons label').forEach(lbl => lbl.addEventListener('click', async () => {
    const target = lbl.dataset.statut;
    if(target === 'en_course') return;
    if(c.statut === 'en_course'){ alert('Terminez votre course en cours avant de changer de statut.'); return; }
    await db.collection('conducteurs').doc(c.id).update({ statut: target });
    c.statut = target;
    navigate(`#/conducteur/dashboard?tel=${encodeURIComponent(tel)}`);
    setTimeout(() => location.reload(), 10);
  }));

  let currentTab = 'demandes';
  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    currentTab = t.dataset.tab;
    setupTab();
  }));

  let tabUnsub = null;
  function clearTabUnsub(){ if(tabUnsub){ tabUnsub(); tabUnsub = null; } }

  function drawDemandesList(dispo){
    const countEl = document.getElementById('demandesCount');
    if(countEl) countEl.textContent = dispo.length;
    const zone = document.getElementById('tabContent');
    if(!zone) return;
    if(c.statut !== 'disponible'){
      zone.innerHTML = `<div class="empty">Passez votre statut sur 🟢 Disponible pour voir les demandes.</div>`;
      return;
    }
    zone.innerHTML = !dispo.length ? `<div class="empty">Aucune demande en attente pour l'instant.</div>` : `<div class="list">` + dispo.map(d => `
      <div class="item-card">
        <div class="item-top">
          <div><div class="item-title">${esc(d.depart)} → ${esc(d.destination)}</div><div class="item-sub">${esc(d.nom)} · ${fmtDate(d.createdAt)}</div></div>
          <span class="badge badge-attente">${d.type}</span>
        </div>
        <div class="item-actions">
          <button type="button" class="btn btn-sm btn-phare" data-accept="${d.id}">Accepter</button>
          <button type="button" class="btn btn-sm btn-ghost dark" data-refuse="${d.id}">Refuser</button>
        </div>
      </div>`).join('') + `</div>`;
  }

  async function setupTab(){
    clearTabUnsub();
    const zone = document.getElementById('tabContent');
    if(currentTab === 'demandes'){
      tabUnsub = db.collection('demandes').where('statut','==','en_attente').where('type','==',c.type)
        .onSnapshot((snap) => { drawDemandesList(snap.docs.map(d=>({id:d.id,...d.data()}))); },
        () => { drawDemandesList([]); });
    }else if(currentTab === 'cours'){
      const demandes = await getDemandes();
      const mine = demandes.filter(d => d.statut === 'attribuee' && d.conducteurId === c.id);
      zone.innerHTML = !mine.length ? `<div class="empty">Aucune course en cours.</div>` : `<div class="list">` + mine.map(d => `
        <div class="item-card">
          <div class="item-top">
            <div><div class="item-title">${esc(d.depart)} → ${esc(d.destination)}</div><div class="item-sub">${esc(d.nom)} · ${esc(d.telephone)}</div></div>
            <span class="badge badge-attribuee">en cours</span>
          </div>
          <div class="item-actions">
            <a class="btn btn-sm" style="background:#25D366;color:#fff;" href="${waLink(d.telephone, 'Bonjour '+d.nom+', votre conducteur MOVALA arrive.')}" target="_blank" rel="noopener">WhatsApp</a>
            <a class="btn btn-sm btn-ghost dark" href="${telLink(d.telephone)}">Appeler</a>
            <button type="button" class="btn btn-sm btn-phare" data-finish="${d.id}">Course terminée</button>
          </div>
        </div>`).join('') + `</div>`;
    }else{
      const demandes = await getDemandes();
      const done = demandes.filter(d => d.statut === 'terminee' && d.conducteurId === c.id).sort((a,b)=>b.createdAt-a.createdAt);
      const total = done.reduce((s,d) => s + (d.montantConducteur||0), 0);
      zone.innerHTML = `<div class="stats"><div class="stat"><b>${done.length}</b><span>Courses</span></div><div class="stat"><b>${fcfa(total)}</b><span>Gains totaux</span></div></div>` +
        (!done.length ? `<div class="empty">Aucune course terminée pour l'instant.</div>` : `<div class="list">` + done.map(d => `
        <div class="item-card">
          <div class="item-top">
            <div><div class="item-title">${esc(d.depart)} → ${esc(d.destination)}</div><div class="item-sub">${fmtDate(d.createdAt)}</div></div>
            <span class="badge badge-terminee">${fcfa(d.montantConducteur)}</span>
          </div>
        </div>`).join('') + `</div>`);
    }
  }
  await setupTab();
  activeUnsub = clearTabUnsub;

  document.getElementById('tabContent').addEventListener('click', async (e) => {
    const acceptId = e.target.dataset.accept;
    const refuseId = e.target.dataset.refuse;
    const finishId = e.target.dataset.finish;
    if(acceptId){
      try{
        await db.runTransaction(async (tx) => {
          const dRef = db.collection('demandes').doc(acceptId);
          const cRef = db.collection('conducteurs').doc(c.id);
          const dDoc = await tx.get(dRef);
          const cDoc = await tx.get(cRef);
          if(!dDoc.exists || dDoc.data().statut !== 'en_attente') throw new Error('DEJA_PRISE');
          if(!cDoc.exists || cDoc.data().statut !== 'disponible') throw new Error('INDISPONIBLE');
          tx.update(dRef, { statut: 'attribuee', conducteurId: c.id, attribueeAt: Date.now() });
          tx.update(cRef, { statut: 'en_course' });
        });
        c.statut = 'en_course';
        alert('Course acceptée !');
        navigate(`#/conducteur/dashboard?tel=${encodeURIComponent(tel)}`);
        setTimeout(() => location.reload(), 10);
      }catch(err){
        if(err.message === 'DEJA_PRISE') alert('Cette course a déjà été prise par un autre conducteur.');
        else if(err.message === 'INDISPONIBLE') alert('Votre statut a changé, actualisez la page.');
        else alert('Erreur : ' + err.message);
      }
    }else if(refuseId){
      /* rien à faire, la demande reste visible pour les autres conducteurs */
    }else if(finishId){
      const prix = prompt('Montant de la course (FCFA) :');
      if(prix === null) return;
      const prixNum = Number(String(prix).replace(/[^0-9]/g,''));
      if(!prixNum || prixNum <= 0){ alert('Montant invalide.'); return; }
      const config = await getConfig();
      const commission = Math.round(prixNum * config.commissionPct / 100);
      const montantConducteur = prixNum - commission;
      await db.collection('demandes').doc(finishId).update({ statut: 'terminee', prix: prixNum, commission, montantConducteur });
      await db.collection('conducteurs').doc(c.id).update({ statut: 'disponible' });
      c.statut = 'disponible';
      navigate(`#/conducteur/dashboard?tel=${encodeURIComponent(tel)}`);
      setTimeout(() => location.reload(), 10);
    }
  });
}

          <tr><th>Client</th><th>Trajet</th><th>Type</th><th>Statut</th><th>Conducteur</th><th>Actions</th></tr>
          ${demandes.slice().sort((a,b)=>b.createdAt-a.createdAt).map(d => {
            const cond = conducteurs.find(c => c.id === d.conducteurId);
            return `<tr>
              <td>${esc(d.nom)}<br><span style="color:var(--gris);">${esc(d.telephone)}</span></td>
              <td>${esc(d.depart)} → ${esc(d.destination)}</td>
              <td>${d.type==='moto'?'🏍️':'🚗'}</td>
              <td><span class="badge badge-${d.statut==='en_attente'?'attente':d.statut}">${d.statut.replace('_',' ')}</span></td>
              <td>${cond ? esc(cond.nom) : (d.statut==='en_attente' ? `<select data-assign="${d.id}"><option value="">Attribuer…</option>${conducteurs.filter(c=>c.actif && c.type===d.type).map(c=>`<option value="${c.id}">${esc(c.nom)}</option>`).join('')}</select>` : '-')}</td>
              <td>${d.statut!=='terminee' && d.statut!=='annulee' ? `<button type="button" class="btn btn-sm btn-danger" data-cancel="${d.id}">Annuler</button>` : ''}</td>
            </tr>`;
          }).join('')}
        </table></div>
      `;
      zone.querySelectorAll('[data-assign]').forEach(sel => sel.addEventListener('change', async (e) => {
        const id = e.target.dataset.assign; const condId = e.target.value;
        if(!condId) return;
        await db.collection('demandes').doc(id).update({ statut: 'attribuee', conducteurId: condId, attribueeAt: Date.now() });
        await db.collection('conducteurs').doc(condId).update({ statut: 'en_course' });
        draw();
      }));
      zone.querySelectorAll('[data-cancel]').forEach(btn => btn.addEventListener('click', async (e) => {
        if(!confirm('Annuler cette demande ?')) return;
        const id = e.target.dataset.cancel;
        await db.collection('demandes').doc(id).update({ statut: 'annulee' });
        draw();
      }));
    }else if(tab === 'signalements'){
      const snap = await db.collection('signalements').orderBy('createdAt','desc').get();
      const items = snap.docs.map(d => ({id:d.id, ...d.data()}));
      zone.innerHTML = !items.length ? `<div class="empty">Aucun signalement pour l'instant.</div>` : `<div class="list">` + items.map(s => `
        <div class="item-card">
          <div class="item-top">
            <div><span class="badge badge-${s.role==='client'?'attente':'attribuee'}">${s.role}</span></div>
            <span class="item-sub">${fmtDate(s.createdAt)}</span>
          </div>
          <p style="font-size:13.5px; margin:8px 0 4px;">${esc(s.texte)}</p>
          ${s.telephone ? `<span class="item-sub">Contact : ${esc(s.telephone)}</span>` : ''}
        </div>`).join('') + `</div>`;
    }else if(tab === 'partager'){
      const baseUrl = location.href.split('#')[0];
      const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(baseUrl)}`;
      zone.innerHTML = `
        <div class="form-card" style="text-align:center;">
          <img src="${qrUrl}" alt="QR code MOVALA" style="width:180px;height:180px;border-radius:12px;margin-bottom:14px;">
          <p style="font-size:13px; word-break:break-all; color:var(--gris);">${esc(baseUrl)}</p>
          <button type="button" class="btn btn-phare btn-block" id="copyLinkBtn" style="margin-top:10px;">Copier le lien</button>
          <p style="font-size:12px; color:var(--gris); margin-top:10px;">Imprimez ce QR code sur vos affiches, ou partagez le lien directement sur WhatsApp et vos statuts.</p>
        </div>`;
      document.getElementById('copyLinkBtn').addEventListener('click', () => {
        navigator.clipboard.writeText(baseUrl).then(() => alert('Lien copié !'));
      });
    }else if(tab === 'reglages'){
      zone.innerHTML = `
        <div class="form-card">
          <div class="form-row"><label>Commission MOVALA (%)</label><input id="rgCommission" type="number" min="0" max="100" value="${config.commissionPct}"></div>
          <div class="form-row"><label>Nouveau mot de passe admin</label><input id="rgPass" type="text" placeholder="Laisser vide pour ne pas changer"></div>
          <button type="button" id="rgSave" class="btn btn-phare btn-block">Enregistrer</button>
          <div class="msg" id="rgMsg"></div>
        </div>`;
      document.getElementById('rgSave').addEventListener('click', async () => {
        const msg = document.getElementById('rgMsg'); msg.className='msg';
        const pct = Number(document.getElementById('rgCommission').value);
        const newPass = document.getElementById('rgPass').value.trim();
        const cfg = await getConfig();
        cfg.commissionPct = isNaN(pct) ? cfg.commissionPct : pct;
        if(newPass) cfg.adminPassword = newPass;
        await saveConfig(cfg);
        msg.className='msg ok'; msg.textContent='Réglages enregistrés.';
      });
    }
  }
  await draw();
}

/* init */
render();
})();
</script>
</body>
</html>
